version: "3.1"

services:
  frontend:
    # container_name: talepod-frontend
    build:
      context: .
    restart: always
    depends_on:
      - backend
    command: yarn start:frontend
    volumes:
      - .:/talepod/
    working_dir: /talepod
    ports:
      - 4000:4000

  backend:
    # container_name: talepod-backend
    build:
      context: .
    restart: always
    command: yarn start:backend
    # volumes:
    #   - .:/public/server/
    # working_dir: /public/server/
    volumes:
      - .:/talepod/
    working_dir: /talepod
    ports:
      - 4001:4001

  production:
    # container_name: talepod-production
    build:
      context: .
    restart: always
    # Enable this volume mapping if you want to test the production setup but without having to rebuild the docker container for every code change.
    # To update the frontend for this you will have to run docker-compose run --rm production yarn build
    # To update the code of the server you have to restart the production container
    #    volumes:
    #      - .:/talepod/
    command: yarn start:prod
    working_dir: /talepod
    ports:
      - 8080:8080
