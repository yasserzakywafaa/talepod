<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#2E3B4E" />
    <meta name="msapplication-TileColor" content="#00BFFF" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Personalize bedtime stories tailored to your child's dreams and imagination"
    />
    <meta
      name="keywords"
      content="bedtime stories for kids, bedtime story, bedtime stories for adults, short bedtime stories"
    />
    <meta name="author" content="TalePod" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https://*.talepod.com; img-src 'self' data: https://*.talepod.com; script-src 'self' https://*.talepod.com;"
    /> -->

    <!-- Open Graph tags (for social media) -->
    <meta property="og:url" content="https://www.talepod.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Create Bedtime Stories with TalePod" />
    <meta
      property="og:description"
      content="Personalize bedtime stories tailored to your child's dreams and imagination."
    />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon_512x512.png" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Create Bedtime Stories" />
    <meta
      name="twitter:description"
      content="Create custom personalized bedtime stories tailored to your child's dreams and imagination."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/icons/icon_512x512.png" />
    <!-- End of Open Graph tags (for social media) -->

    <link rel="canonical" href="https://www.talepod.com/" />
    <link
      rel="icon"
      href="%PUBLIC_URL%/icons/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="shortcut icon"
      href="%PUBLIC_URL%/icons/favicon.ico"
      type="image/x-icon"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/icons/apple_touch_icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/icons/favicon_32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/icons/favicon_16x16.png"
    />
    <link
      rel="mask-icon"
      href="%PUBLIC_URL%/icons/safari_pinned_tab.svg"
      color="#ad932d"
    />
    <link rel="manifest" href="%PUBLIC_URL%/app.webmanifest.json" />
    <link rel="alternate" hreflang="en" href="https://www.talepod.com/" />

    <title>TalePod</title>
    <script src="%PUBLIC_URL%/sw-register.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TalePod",
        "url": "https://www.talepod.com"
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- 
      ONLY for development purposes/
      Live Reload was causing issues while extracting ZIP file.
      Disable it by starting the app with:
      REACT_APP_DISABLE_LIVE_RELOAD=true <start_command>
    -->
    <script type="text/javascript">
      // console.log("<<<: index.html NODE_ENV :>>>", "%NODE_ENV%");
      if (
        "%NODE_ENV%".trim() === "development" &&
        "%REACT_APP_DISABLE_LIVE_RELOAD%".trim() === "true"
      ) {
        console.log(
          "<<<: index.html REACT_APP_DISABLE_LIVE_RELOAD :>>>",
          "%REACT_APP_DISABLE_LIVE_RELOAD%"
        );
        const WS = window.WebSocket;
        function DevWebSocket(s) {
          if (s === "ws://localhost:4000/ws") {
            console.log("<<<: Live Reload Has Been Disabled :>>>");
            return {};
          } else {
            // Pass through other usage of sockets
            return new WS(s);
          }
        }
        window.WebSocket = DevWebSocket;
      }
    </script>
  </body>
</html>
