<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="TalePod | Story Creator" />
    <link rel="icon" href="%PUBLIC_URL%/icons/logo.png" />
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/icons/maskable_icon_x512.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/icons/favicon-16x16.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/icons/site.webmanifest" />
    <link
      rel="mask-icon"
      href="%PUBLIC_URL%/icons/safari-pinned-tab.svg"
      color="#ad932d"
    />
    <meta name="msapplication-TileColor" content="#da532c" />

    <link rel="manifest" href="%PUBLIC_URL%/app.webmanifest.json" />
    <title>TalePod | Story Creator</title>
    <script src="%PUBLIC_URL%/sw-register.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- 
      ONLY for development purposes/
      Live Reload was causing issues while extracting ZIP file.
      Disable it by starting the app with:
      REACT_APP_DISABLE_LIVE_RELOAD=true <start_command>
    -->
    <script type="text/javascript">
      // console.log("<<<: index.html NODE_ENV :>>>", "%NODE_ENV%");
      if (
        "%NODE_ENV%".trim() === "development" &&
        "%REACT_APP_DISABLE_LIVE_RELOAD%".trim() === "true"
      ) {
        console.log(
          "<<<: index.html REACT_APP_DISABLE_LIVE_RELOAD :>>>",
          "%REACT_APP_DISABLE_LIVE_RELOAD%"
        );
        const WS = window.WebSocket;
        function DevWebSocket(s) {
          if (s === "ws://localhost:4000/ws") {
            console.log("<<<: Live Reload Has Been Disabled :>>>");
            return {};
          } else {
            // Pass through other usage of sockets
            return new WS(s);
          }
        }
        window.WebSocket = DevWebSocket;
      }
    </script>
  </body>
</html>
